
  <nav aria-label="...">
  <ul class="pagination pagination-sm">
    @for(page of getPagesList();track page){
    <li class="page-item" 
    [class.active]="page == activePage()"
    [routerLink]="[]"
    [queryParams]="{ page:page}"
    (click)="activePage.set(page)"
     >
      <span class="page-link"> {{ page }}</span>
    </li>
  }  
  </ul>
</nav>
