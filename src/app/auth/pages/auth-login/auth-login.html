<div class="col-4 offset-4">
  <div class="text-center" style="margin-top:40%;">
      <img src="../logo.png" />
  </div>
  <hr />

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
          <input  type="email"  class="form-control" placeholder="E-mail"  formControlName="email">
          @if ( formUtils.isValidField?.(loginForm, 'email')) {
            <span class="form-text text-danger">
              <!-- El valor ingresado no parece un correo electrónico -->
              {{ formUtils.getFieldError(loginForm, "email") }}
            </span>
            }
      </div>
      <div class="mb-3">
          <input type="password"  class="form-control" placeholder="Password" formControlName="password">
          @if ( formUtils.isValidField?.(loginForm, 'password')) {
            <span class="form-text text-danger">
              <!-- El valor ingresado no parece un correo electrónico -->
              {{ formUtils.getFieldError(loginForm, "password") }}
            </span>
            }
      </div>

      <div class="mb-3">
          <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </div>
  </form>
</div>
